<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>I Choose How - Fictional demonstration</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon.png" />
  <link rel="apple-touch-icon" href="assets/brand/monogram-app-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page-shell">
    <div class="phone-frame" id="app-root">
      <a class="skip-link" href="#main">Skip to content</a>
      <header class="app-header" role="banner">
        <div class="brand-row">
          <div class="brand">
            <img
              class="brand-mark"
              src="assets/brand/monogram-app-icon.png"
              width="40"
              height="40"
              alt=""
            />
            <div class="brand-text">
              <p class="brand-name">I Choose How</p>
              <p class="demo-label">Fictional demonstration</p>
            </div>
          </div>
          <button type="button" class="btn btn-text" id="btn-about" aria-haspopup="dialog">About</button>
        </div>
        <div class="toolbar" id="explanation-toolbar" hidden>
          <p class="toolbar-label" id="mode-toolbar-label">How I want information</p>
          <div class="mode-tabs" role="group" aria-labelledby="mode-toolbar-label">
            <button type="button" class="mode-tab" data-mode="read" aria-pressed="true">Read</button>
            <button type="button" class="mode-tab" data-mode="listen" aria-pressed="false">Listen</button>
            <button type="button" class="mode-tab" data-mode="show" aria-pressed="false">Show me</button>
            <button type="button" class="mode-tab" data-mode="supporter" aria-pressed="false">Supporter</button>
          </div>
        </div>
        <p class="progress" id="progress-label" hidden aria-live="polite"></p>
      </header>
      <main id="main" class="app-main" tabindex="-1"></main>
      <nav class="app-nav" aria-label="Primary">
        <button type="button" class="btn btn-secondary" id="btn-back">Back</button>
        <button type="button" class="btn btn-secondary" id="btn-home">Home</button>
        <button type="button" class="btn btn-secondary" id="btn-restart">Start again</button>
      </nav>
      <footer class="app-footer" id="decision-footer" hidden>
        <p>This demonstration does not record consent or provide legal advice.</p>
      </footer>
    </div>
  </div>
  <div id="about-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="about-title" hidden>
    <div class="dialog-panel">
      <h2 id="about-title">About this demonstration</h2>
      <div class="dialog-body" id="about-body"></div>
      <button type="button" class="btn btn-primary" id="btn-about-close">Close</button>
    </div>
  </div>
  <script src="js/content.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
